name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    name: Windows (MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure CMake
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build Release
        run: cmake --build build --parallel

      - name: Run self-tests
        run: ctest --test-dir build --output-on-failure

  build-linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenGL and FreeGLUT dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake freeglut3-dev libglu1-mesa-dev

      - name: Configure CMake
        run: cmake -S . -B build -DTEA_FETCH_FREEGLUT=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --parallel

      - name: Run self-tests
        run: ctest --test-dir build --output-on-failure
